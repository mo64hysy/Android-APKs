name: Build mo64 Keyboard APK

on:
  push:
    branches: [main]
    paths:
      - "mo64Keyboard/app/**"
      - "mo64Keyboard/mozc/src/main/java/**"
      - "mo64Keyboard/mozc/src/main/proto/**"
      - "mo64Keyboard/mozc/build.gradle.kts"
      - "mo64Keyboard/build.gradle.kts"
      - "mo64Keyboard/settings.gradle.kts"
      - "mo64Keyboard/gradle/**"
      - "mo64Keyboard/gradlew"
      - "mo64Keyboard/gradle.properties"
  workflow_dispatch:

concurrency:
  group: mo64-keyboard-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mo64Keyboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mo64Keyboard-apk
          path: mo64Keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
