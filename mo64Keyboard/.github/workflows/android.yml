name: Android Debug APK
on:
  push:
    branches: [ "main", "master", "mozc-integration" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.2.12479018'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git python3 unzip zip
      # Mozc native outputs are unchanged by normal Kotlin/UI edits.
      # Cache only the staged engine, dictionary and protocol files; a cache hit
      # skips both the Bazel bootstrap and the full Mozc native build.
      - name: Restore Mozc native build cache
        id: mozc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mozc/src/main/jniLibs
            mozc/src/main/assets/mozc.data
            mozc/src/main/proto/protocol
          key: mozc-native-${{ runner.os }}-ndk27-${{ hashFiles('scripts/bootstrap_bazel.sh', 'scripts/build_mozc.sh', 'scripts/gen_system_dictionary.py', 'scripts/fetch_dictionaries.sh', 'patches/**', 'third_party/dictionaries/**') }}
      - name: Build Bazel from source
        if: steps.mozc-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/bootstrap_bazel.sh scripts/build_mozc.sh
          ./scripts/bootstrap_bazel.sh
      - name: Build Mozc native engine and dictionary
        if: steps.mozc-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./scripts/build_mozc.sh
      - name: Save Mozc native build cache
        if: steps.mozc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mozc/src/main/jniLibs
            mozc/src/main/assets/mozc.data
            mozc/src/main/proto/protocol
          key: mozc-native-${{ runner.os }}-ndk27-${{ hashFiles('scripts/bootstrap_bazel.sh', 'scripts/build_mozc.sh', 'scripts/gen_system_dictionary.py', 'scripts/fetch_dictionaries.sh', 'patches/**', 'third_party/dictionaries/**') }}
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKeyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
